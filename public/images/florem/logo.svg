<svg xmlns="http://www.w3.org/2000/svg" width="420" height="110" viewBox="0 0 420 110">
  <defs>
    <style>
      .name { font: bold 34px Georgia, "Times New Roman", Times, serif; fill: #C49A3A; }
      .sub { font: 14px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #6B7280; letter-spacing: 0.06em; }
    </style>
  <!-- Official FLOREM school logo — gold laurel wreath, central shield, purple emblem -->
  <g className="relative">
    <g className="absolute inset-0">
      <!-- Laurel wreath ring -->
      <circle cx="56" cy="60" r="38" fill="none" stroke="#C49A3A" stroke-width="3" stroke-linecap="round" />
      <!-- Central shield -->
      <path d="M34 60 Q56 20 78 60" fill="none" stroke="#C49A3A" stroke-width="3" stroke-linecap="round" />
      <!-- Purple emblem circle -->
      <circle cx="56" cy="60" r="4" fill="#70449A" />
      <!-- Gold accent circle -->
      <circle cx="56" cy="60" r="4" fill="#C49A3A" />
    </g>
    <text x="96" y="70">FLOREM</text>
    <text x="96" y="94">Nursery & Primary School</text>
  </g>
</svg>